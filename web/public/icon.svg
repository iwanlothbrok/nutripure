<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles matching iOS icon standards -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing background ring -->
  <circle cx="230" cy="220" r="140" fill="none" stroke="url(#emeraldGrad)" stroke-width="20" opacity="0.25" filter="url(#glow)"/>

  <!-- Scout / PureCheck inspired magnifying glass + Leaf icon -->
  <!-- Magnifier Glass Ring -->
  <circle cx="230" cy="220" r="120" fill="none" stroke="url(#emeraldGrad)" stroke-width="28" stroke-linecap="round"/>
  
  <!-- Magnifier Handle -->
  <line x1="320" y1="310" x2="415" y2="405" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>

  <!-- Modern Pure Leaf inside the glass -->
  <path d="M230 150 C290 150, 300 210, 300 230 C300 290, 240 290, 230 290 C170 290, 160 230, 160 210 C160 150, 220 150, 230 150 Z" fill="url(#emeraldGrad)" opacity="0.95"/>
  <!-- Leaf Center Stem -->
  <path d="M185 265 Q230 235 275 175" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>
  
  <!-- Small spark/star accent -->
  <circle cx="160" cy="150" r="10" fill="#34D399" filter="url(#glow)"/>
</svg>
